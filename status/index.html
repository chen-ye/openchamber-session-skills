<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Session Skills</title>
    <style>
      :root {
        color-scheme: dark light;
        font-family: var(--oc-font, system-ui, -apple-system, sans-serif);
        color: var(--oc-fg, inherit);
        background: transparent;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }
      #root {
        display: flex;
        flex-direction: column;
      }

      /* Work Status surface */
      .ss-status-root {
        display: flex;
        flex-direction: column;
      }
      .ss-status-list {
        display: flex;
        flex-direction: column;
        gap: 0.125rem;
      }
      .ss-note {
        margin: 0;
        padding: 0.25rem 0.25rem;
        min-height: 1.75rem;
        display: flex;
        align-items: center;
        font-size: 0.8125rem;
        line-height: 1.3;
        color: var(--oc-muted, rgba(128, 128, 128, 0.85));
      }
      .ss-note[data-tone="warning"] {
        color: var(--oc-warning-text, var(--oc-warning, #d97706));
      }

      /* Collapsible Subagent group */
      .ss-subagent-section {
        display: flex;
        flex-direction: column;
        gap: 0.125rem;
      }
      .ss-subagent-section[data-separated="true"] {
        margin-top: 0.25rem;
        padding-top: 0.25rem;
        border-top: 1px solid color-mix(in srgb, var(--oc-border, rgba(128, 128, 128, 0.22)) 65%, transparent);
      }
      .ss-subagent-toggle {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--oc-muted, rgba(128, 128, 128, 0.9));
        font: inherit;
        width: 100%;
        min-height: 1.5625rem;
        padding: 0.125rem 0.25rem;
        border-radius: calc(var(--oc-radius, 0.375rem) - 2px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.375rem;
        cursor: pointer;
        transition: background-color 120ms ease, color 120ms ease;
      }
      .ss-subagent-toggle:hover {
        background: var(--oc-hover, rgba(128, 128, 128, 0.1));
        color: var(--oc-fg, inherit);
      }
      .ss-subagent-toggle:focus-visible {
        outline: 1.5px solid var(--oc-focus, var(--oc-primary, #4f86f7));
        outline-offset: -1.5px;
      }
      .ss-subagent-head-left {
        display: flex;
        align-items: center;
        gap: 0.3125rem;
        min-width: 0;
        flex: 1 1 auto;
      }
      .ss-chevron {
        width: 0.75rem;
        height: 0.75rem;
        flex-shrink: 0;
        transition: transform 120ms ease;
        opacity: 0.85;
      }
      .ss-subagent-toggle[aria-expanded="true"] .ss-chevron {
        transform: rotate(90deg);
      }
      .ss-subagent-label {
        font-size: 0.75rem;
        font-weight: 500;
        line-height: 1.25;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .ss-subagent-count {
        font-size: 0.71875rem;
        font-variant-numeric: tabular-nums;
        color: var(--oc-muted, rgba(128, 128, 128, 0.8));
        flex-shrink: 0;
        min-width: 1.95rem;
        text-align: right;
      }

      /* Skill Row */
      .ss-row-group {
        display: flex;
        flex-direction: column;
      }
      .ss-row {
        appearance: none;
        border: 0;
        background: transparent;
        color: inherit;
        font: inherit;
        text-align: left;
        width: 100%;
        min-height: 1.75rem;
        padding: 0.1875rem 0.25rem;
        border-radius: calc(var(--oc-radius, 0.375rem) - 2px);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
        cursor: pointer;
        transition: background-color 120ms ease;
      }
      .ss-row:hover,
      .ss-row[data-oc-popover-open="true"] {
        background: var(--oc-hover, rgba(128, 128, 128, 0.1));
      }
      .ss-row:focus-visible {
        outline: 1.5px solid var(--oc-focus, var(--oc-primary, #4f86f7));
        outline-offset: -1.5px;
      }
      .ss-row-left {
        display: flex;
        align-items: center;
        gap: 0.4375rem;
        min-width: 0;
        flex: 1 1 auto;
      }
      .ss-dot {
        width: 0.4375rem;
        height: 0.4375rem;
        border-radius: 9999px;
        flex-shrink: 0;
        background: var(--oc-success, #2fb375);
      }
      .ss-dot[data-tone="deep"] {
        background: var(--oc-warning, #e59934);
      }
      .ss-dot[data-tone="compacted"] {
        background: transparent;
        border: 1.5px solid var(--oc-muted, rgba(128, 128, 128, 0.75));
      }
      .ss-dot[data-tone="loading"] {
        background: var(--oc-info, #3b82f6);
        animation: ss-pulse 1.2s ease-in-out infinite;
      }
      .ss-dot[data-tone="failed"] {
        background: var(--oc-error, #ef4444);
      }
      @keyframes ss-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.38; }
      }
      .ss-name {
        font-family: var(--oc-mono, ui-monospace, monospace);
        font-size: 0.78125rem;
        line-height: 1.3;
        color: var(--oc-fg, inherit);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-width: 0;
      }
      .ss-row[data-compacted="true"] .ss-name {
        color: var(--oc-muted, rgba(128, 128, 128, 0.85));
      }
      .ss-row[data-status="failed"] .ss-name {
        color: var(--oc-error-text, var(--oc-error, #ef4444));
      }

      /* Right side: [visual-bar] + aligned turn age */
      .ss-row-right {
        display: flex;
        align-items: center;
        gap: 0.4375rem;
        flex-shrink: 0;
      }
      .ss-bar {
        position: relative;
        width: 2.75rem;
        height: 0.375rem;
        border-radius: 9999px;
        background: color-mix(in srgb, var(--oc-fg, currentColor) 12%, transparent);
        flex-shrink: 0;
      }
      .ss-bar[data-compacted="true"] {
        background: transparent;
        border: 1px dashed color-mix(in srgb, var(--oc-muted, currentColor) 55%, transparent);
      }
      .ss-bar-tail {
        position: absolute;
        top: 0;
        bottom: 0;
        left: clamp(0.1875rem, var(--pip-pct, 100%), calc(100% - 0.1875rem));
        right: 0;
        border-radius: 0 9999px 9999px 0;
        background: color-mix(in srgb, var(--oc-fg, currentColor) 8%, transparent);
      }
      .ss-bar-pip {
        position: absolute;
        top: 50%;
        left: clamp(0.1875rem, var(--pip-pct, 100%), calc(100% - 0.1875rem));
        width: 0.3125rem;
        height: 0.5rem;
        border-radius: 2px;
        transform: translate(-50%, -50%);
        background: var(--oc-success, #2fb375);
      }
      .ss-bar-pip[data-tone="deep"] {
        background: var(--oc-warning, #e59934);
      }
      .ss-bar-pip[data-tone="loading"] {
        background: var(--oc-info, #3b82f6);
      }

      .ss-age {
        width: 1.95rem;
        text-align: right;
        font-size: 0.75rem;
        line-height: 1.25;
        font-variant-numeric: tabular-nums;
        color: var(--oc-muted, rgba(128, 128, 128, 0.85));
        white-space: nowrap;
        flex-shrink: 0;
      }
      .ss-age[data-fresh="true"] {
        color: var(--oc-success-text, var(--oc-success, #2fb375));
      }
      .ss-age[data-status="loading"] {
        color: var(--oc-info-text, var(--oc-info, #3b82f6));
      }
      .ss-failed-label {
        font-size: 0.75rem;
        line-height: 1.25;
        color: var(--oc-error-text, var(--oc-error, #ef4444));
        white-space: nowrap;
      }

      /* Inline fallback drawer when host popovers are unavailable */
      .ss-inline-detail {
        margin: 0.125rem 0.25rem 0.3125rem 0.9375rem;
        padding: 0.5rem 0.625rem;
        border-radius: calc(var(--oc-radius, 0.375rem) - 2px);
        background: var(--oc-muted-surface, rgba(128, 128, 128, 0.08));
        border: 1px solid var(--oc-border, rgba(128, 128, 128, 0.18));
        display: flex;
        flex-direction: column;
        gap: 0.4375rem;
      }

      /* Popover surface */
      .ss-popover {
        padding: 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.5625rem;
        background: var(--oc-elevated, transparent);
      }
      .ss-pop-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.5rem;
      }
      .ss-pop-title {
        margin: 0;
        font-family: var(--oc-mono, ui-monospace, monospace);
        font-size: 0.84375rem;
        font-weight: 600;
        line-height: 1.3;
        word-break: break-word;
        min-width: 0;
      }
      .ss-pop-depth {
        display: flex;
        flex-direction: column;
        gap: 0.3125rem;
        padding: 0.4375rem 0.5625rem;
        border-radius: calc(var(--oc-radius, 0.375rem) - 2px);
        background: var(--oc-muted-surface, rgba(128, 128, 128, 0.07));
        border: 1px solid color-mix(in srgb, var(--oc-border, rgba(128, 128, 128, 0.2)) 75%, transparent);
      }
      .ss-pop-depth-meta {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 0.5rem;
        font-size: 0.71875rem;
        font-variant-numeric: tabular-nums;
        color: var(--oc-muted, rgba(128, 128, 128, 0.9));
      }
      .ss-pop-depth-primary {
        color: var(--oc-fg, inherit);
        font-weight: 500;
      }
      .ss-pop-bar {
        width: 100%;
        height: 0.375rem;
      }
      .ss-pop-desc {
        margin: 0;
        font-size: 0.78125rem;
        line-height: 1.42;
        color: var(--oc-fg, inherit);
      }
      .ss-pop-prov {
        display: flex;
        flex-direction: column;
        gap: 0.1875rem;
        font-size: 0.75rem;
        line-height: 1.35;
        color: var(--oc-muted, rgba(128, 128, 128, 0.88));
      }
      .ss-pop-path {
        font-family: var(--oc-mono, ui-monospace, monospace);
        font-size: 0.6875rem;
        line-height: 1.35;
        color: var(--oc-muted, rgba(128, 128, 128, 0.82));
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ss-pop-preview {
        margin: 0;
        max-height: 8.25rem;
        overflow-y: auto;
        padding: 0.5rem 0.625rem;
        border-radius: calc(var(--oc-radius, 0.375rem) - 2px);
        background: var(--oc-muted-surface, rgba(128, 128, 128, 0.08));
        border: 1px solid var(--oc-border, rgba(128, 128, 128, 0.16));
        font-family: var(--oc-mono, ui-monospace, monospace);
        font-size: 0.6875rem;
        line-height: 1.45;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .ss-pop-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.375rem;
        padding-top: 0.125rem;
      }

      /* Compact Heatmap Popover */
      .ss-hm-popover {
        padding: 0.75rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        background: var(--oc-elevated, transparent);
      }
      .ss-hm-sub {
        font-size: 0.71875rem;
        color: var(--oc-muted, rgba(128, 128, 128, 0.88));
        margin: 0;
      }
      .ss-hm-table-wrap {
        max-height: 17.5rem;
        overflow: auto;
      }
      .ss-hm-table {
        width: 100%;
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      .ss-hm-table th,
      .ss-hm-table td {
        padding: 0.2rem 0.2rem;
        font-size: 0.6875rem;
        text-align: center;
        border-bottom: 1px solid color-mix(in srgb, var(--oc-border, rgba(128, 128, 128, 0.16)) 60%, transparent);
      }
      .ss-hm-table th {
        color: var(--oc-muted, rgba(128, 128, 128, 0.85));
        font-weight: 500;
      }
      .ss-hm-table th.left,
      .ss-hm-table td.left {
        text-align: left;
      }
      .ss-hm-skill-btn {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--oc-fg, inherit);
        font-family: var(--oc-mono, ui-monospace, monospace);
        font-size: 0.6875rem;
        padding: 0.1rem 0;
        cursor: pointer;
        max-width: 10.5rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: left;
      }
      .ss-hm-skill-btn:hover {
        text-decoration: underline;
      }
      .ss-hm-cell {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 1.25rem;
        height: 1rem;
        border-radius: 3px;
        font-size: 0.625rem;
      }
      .ss-hm-cell.l0 { background: var(--oc-muted-surface, rgba(128, 128, 128, 0.1)); color: transparent; }
      .ss-hm-cell.l1 { background: color-mix(in srgb, var(--oc-success, #2fb375) 26%, var(--oc-muted-surface, transparent)); }
      .ss-hm-cell.l2 { background: color-mix(in srgb, var(--oc-success, #2fb375) 50%, var(--oc-muted-surface, transparent)); }
      .ss-hm-cell.l3 { background: color-mix(in srgb, var(--oc-success, #2fb375) 75%, var(--oc-muted-surface, transparent)); color: #fff; font-weight: 600; }
      .ss-hm-cell.l4 { background: var(--oc-success, #2fb375); color: #fff; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="./main.js"></script>
  </body>
</html>
